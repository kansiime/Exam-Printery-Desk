# Runs the whole system on one server:  docker compose up -d --build
# Put HTTPS in front (for example Caddy, or Certbot with nginx) before real use.
x-backend-env: &backend-env
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    CELERY_EAGER: "0"
    MEDIA_ROOT: /srv/media

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printery}
      POSTGRES_USER: ${POSTGRES_USER:-printery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printery}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    volumes: [media:/srv/media]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }

  worker:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    command: celery -A config worker -l info
    volumes: [media:/srv/media]
    depends_on: [backend]

  beat:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    command: celery -A config beat -l info
    depends_on: [backend]

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]

volumes:
  pgdata:
  media:
